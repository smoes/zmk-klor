# Nutzer-Einstellungen. Werden mit den Shield-Defaults aus
# config/boards/shields/klor/klor.conf zusammengefuehrt.

# Akkuanzeige
CONFIG_ZMK_BATTERY_REPORTING=y

# Deep Sleep nach 15 Minuten Inaktivitaet.
# Wichtig fuer die Laufzeit: das Trackpad zieht im aktiven Sensing dauerhaft Strom.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Logging ueber USB — nur zur Fehlersuche einschalten, kostet Strom.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
