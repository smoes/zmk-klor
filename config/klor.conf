# Nutzer-Einstellungen. Werden mit den Shield-Defaults aus
# config/boards/shields/klor/klor.conf zusammengefuehrt.

# Akkuanzeige
CONFIG_ZMK_BATTERY_REPORTING=y

# Deep Sleep nach 15 Minuten Inaktivitaet.
# Wichtig fuer die Laufzeit: das Trackpad zieht im aktiven Sensing dauerhaft Strom.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Logging ueber USB laeuft nicht ueber diese Datei, sondern ueber das
# Snippet zmk-usb-logging in build.yaml — nur so kommt auch das noetige
# Devicetree-Overlay fuer den CDC-ACM-Knoten mit. Und nur fuer die rechte
# (zentrale) Haelfte: die linke ist peripher und hat keinen USB-Stack.
