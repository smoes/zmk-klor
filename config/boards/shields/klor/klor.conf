# Encoder (nur links bestueckt)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Kein OLED, kein Buzzer, kein Speaker.
CONFIG_ZMK_DISPLAY=n

# Per-Key-RGB ist auf dem PCB moeglich, hier aber bewusst aus:
# es kostet spuerbar Akkulaufzeit. Zum Aktivieren beide Zeilen einkommentieren
# und chain-length in boards/nice_nano_nrf52840_zmk.overlay an das Layout anpassen.
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
